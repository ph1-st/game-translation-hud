[project]
name = "game-translation-hud"
dynamic = ["version"]  # app/__init__.py VERSION: one number for the app, the zip and this
description = "Translations drawn over a Japanese game's own text while you play: OCR, a shared translation database, live translation for the rest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    # opencv-python on Windows (the dev video player uses its window); the headless build
    # elsewhere: the full Linux wheel carries a Qt 5 of its own that clashes with PySide6
    "opencv-python>=4.9; sys_platform == 'win32'",
    "opencv-python-headless>=4.9; sys_platform != 'win32'",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "rapidocr>=3.0",
    # DirectML runs on any DirectX 12 GPU on Windows; elsewhere the CPU build (for NVIDIA
    # GPUs on Linux, swap in onnxruntime-gpu: README, "Building from source")
    "onnxruntime-directml>=1.17; sys_platform == 'win32'",
    "onnxruntime>=1.17; sys_platform != 'win32'",
    "pyside6-essentials>=6.7",
    "dxcam>=0.3; sys_platform == 'win32'",
    "mss>=9.0",
    "psutil>=5.9",
    "anthropic>=1.15.0",
    "keyring>=25.7.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pillow>=10.0",  # tools/make_icon.py
    "pyinstaller>=6.22.3",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv]
# rapidocr asks for opencv-python-headless and Windows has opencv-python: both install the
# same cv2 package over each other, so on Windows the headless one never comes in.
override-dependencies = ["opencv-python-headless>=4.9; sys_platform != 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app", "capture", "translate", "db", "hud", "sync", "i18n"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["UP037"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "windows_only: needs Windows (Win32 calls, DirectML)",
    "x11: needs an X server (run under Xvfb)",
    "footage: needs the stream frames in tests/frames (not in the public tree)",
    "slow: takes more than a few seconds",
]
