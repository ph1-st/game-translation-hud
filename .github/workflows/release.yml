# A version tag (v1.1.0) builds the app on Windows and Linux from this source, each build
# checks itself (the self-test), and a draft release gets the packages and their SHA-256
# sums. Each package gets a build attestation: anyone can check that it was built here, from
# this source (`gh attestation verify <file> -R <owner>/<repo>`). The draft is published by
# hand, after a look at it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write  # (the attestation's signature)
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt's X11 libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcomposite1 libxcb-cursor0 \
            libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libegl1 libgl1 \
            libfontconfig1 libdbus-1-3 file
      - run: uv sync --locked --extra dev
      - name: Our own bootloader (Windows)
        if: runner.os == 'Windows'
        run: uv run python packaging/build_bootloader.py
      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          GTHUD_SELFTEST_CPU: "1"  # (a CI machine may have no DirectX 12 GPU)
        run: uv run python packaging/build.py
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          uv run python packaging/build.py --appimagetool ./appimagetool
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: SHA-256 sums
        working-directory: packages
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: packages/*
